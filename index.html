<html style="margin:0;padding:0;">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800&family=Dancing+Script:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
(function(){
  var s=document.createElement('style');
  s.textContent=':root{'+
    '--bg:#fdf9fb;'+
    '--card:#ffffff;'+
    '--text:#0f172a;'+
    '--muted:#64748b;'+
    '--accent:#bd3193;'+
    '--accent-soft:rgba(189,49,147,.14);'+
    '--accent2:#0891b2;'+
    '--accent2-soft:rgba(8,145,178,.14);'+
    '--border:rgba(15,23,42,.07);'+
    '--rose:#e8b4c8;'+
    '--gold:#d4a574}'+
    '*{box-sizing:border-box}'+
    'body{margin:0;font-family:"Urbanist",sans-serif;background:var(--bg);color:var(--text);line-height:1.7;overflow-x:hidden}'+
    '.script{font-family:"Dancing Script",cursive}'+
    '@keyframes floatUp{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(-120vh) rotate(360deg);opacity:0}}'+
    '@keyframes floatSway{0%,100%{transform:translateX(0)}50%{transform:translateX(20px)}}'+
    '@keyframes pulseHeart{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}'+
    '@keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}'+
    '@keyframes sparkle{0%,100%{opacity:0;transform:scale(0)}50%{opacity:1;transform:scale(1)}}'+
    '@keyframes balloonFloat{0%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-15px) rotate(3deg)}100%{transform:translateY(0) rotate(-3deg)}}'+
    '@keyframes confettiFall{0%{transform:translateY(-100px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}'+
    '@keyframes cakeGlow{0%,100%{filter:drop-shadow(0 0 8px rgba(212,165,116,.4))}50%{filter:drop-shadow(0 0 20px rgba(212,165,116,.8))}}'+
    '@keyframes flameFlicker{0%,100%{transform:scaleY(1) scaleX(1)}25%{transform:scaleY(1.1) scaleX(.9)}50%{transform:scaleY(.9) scaleX(1.1)}75%{transform:scaleY(1.05) scaleX(.95)}}'+
    '.reveal{opacity:0;transform:translateY(30px);transition:all .8s ease}.reveal.visible{opacity:1;transform:translateY(0)}'+
    '.heart-btn{cursor:pointer;transition:transform .2s}.heart-btn:hover{transform:scale(1.1)}.heart-btn:active{transform:scale(.95)}'+
    '.floating-heart{position:fixed;pointer-events:none;z-index:9999;animation:floatUp 4s ease-out forwards}'+
    '.confetti-piece{position:fixed;pointer-events:none;z-index:9998;animation:confettiFall linear forwards}'+
    '.gradient-text{background:linear-gradient(100deg,var(--accent),#e879b5,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}'+
    '.love-card{background:linear-gradient(135deg,#fff 0%,#fdf2f8 100%);border:1px solid var(--border);border-radius:24px;transition:all .4s ease;position:relative;overflow:hidden}'+
    '.love-card:hover{transform:translateY(-5px);box-shadow:0 20px 60px rgba(189,49,147,.15)}'+
    '.wish-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px;transition:all .3s ease;cursor:pointer}'+
    '.wish-card:hover{border-color:var(--accent);transform:translateY(-4px);box-shadow:0 12px 40px rgba(189,49,147,.12)}'+
    '.timeline-dot{width:16px;height:16px;border-radius:50%;background:var(--accent);position:relative}'+
    '.timeline-dot::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--accent);animation:pulseHeart 2s infinite}'+
    '.section-bg{background:radial-gradient(800px 400px at 20% 0%,var(--accent-soft),transparent 70%),radial-gradient(600px 300px at 80% 100%,rgba(212,165,116,.1),transparent 60%),var(--bg)}'+
    '.letter-envelope{background:linear-gradient(135deg,#fdf2f8,#fce7f3);border-radius:16px;padding:40px;position:relative;border:1px solid rgba(189,49,147,.2)}'+
    '.letter-envelope::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:0;height:0;border-left:60px solid transparent;border-right:60px solid transparent;border-top:40px solid rgba(189,49,147,.15)}'+
    'button{font-family:inherit}';
  document.head.appendChild(s);
})();
</script>
